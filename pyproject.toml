[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compass"
version = "0.1.0"
description = "COMPASS: Crowd-guided Online radio Mapping with Propagation-Aware Sequential Sensing"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary - research" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
